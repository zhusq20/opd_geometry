eval:
  defaults:
    apply_chat_template: true
    apply_chat_template_kwargs:
      enable_thinking: false
    custom_rm_path: slime_plugins.m2rl.rewards.reward
    top_k: -1
  datasets:
    - name: math500_pass1
      path: ${oc.env:MOPD_DATA_ROOT}/eval/m2rl_online/math500.parquet
      rm_type: deepscaler
      n_samples_per_eval_prompt: 1
      temperature: 0.0
      top_p: 1.0
      max_response_len: 8192
    - name: livecodebench_postcutoff_pass1
      path: ${oc.env:MOPD_DATA_ROOT}/single_task/code/livecodebench_v6_online128.parquet
      rm_type: livecodebench
      n_samples_per_eval_prompt: 1
      temperature: 0.0
      top_p: 1.0
      max_response_len: 8192
    - name: ifbench_strict
      path: ${oc.env:MOPD_DATA_ROOT}/eval/m2rl_online/ifbench.parquet
      rm_type: ifbench
      n_samples_per_eval_prompt: 1
      temperature: 0.0
      top_p: 1.0
      max_response_len: 8192
    - name: gpqa_diamond_avg4
      path: ${oc.env:MOPD_DATA_ROOT}/eval/m2rl_online/gpqa_diamond.parquet
      rm_type: gpqa
      n_samples_per_eval_prompt: 4
      temperature: 1.0
      top_p: 1.0
      max_response_len: 8192
