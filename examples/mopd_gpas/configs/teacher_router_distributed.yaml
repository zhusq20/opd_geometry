schema_version: 4
concurrency: 8
request_timeout: 900
resident_pool:
  gpu_count: 2
  physical_gpus:
    math: ${MOPD_TEACHER_MATH_GPU}
    code: ${MOPD_TEACHER_CODE_GPU}
    if: ${MOPD_TEACHER_IF_GPU}
    science: ${MOPD_TEACHER_SCIENCE_GPU}
teachers:
  math:
    url: http://127.0.0.1:${MOPD_TEACHER_MATH_PORT}/generate
    model_path: ${MOPD_TEACHER_HF_ROOT}/math
    prompt_suffix: "<think>\n\n</think>\n\n"
  code:
    url: http://127.0.0.1:${MOPD_TEACHER_CODE_PORT}/generate
    model_path: ${MOPD_TEACHER_HF_ROOT}/code
    prompt_suffix: "<think>\n\n</think>\n\n"
  if:
    url: http://127.0.0.1:${MOPD_TEACHER_IF_PORT}/generate
    model_path: ${MOPD_TEACHER_HF_ROOT}/if
    prompt_suffix: "<think>\n\n</think>\n\n"
  science:
    url: http://127.0.0.1:${MOPD_TEACHER_SCIENCE_PORT}/generate
    model_path: ${MOPD_TEACHER_HF_ROOT}/science
    prompt_suffix: "<think>\n\n</think>\n\n"
